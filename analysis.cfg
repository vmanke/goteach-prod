# goteach — Minimal-Config für die KataGo Analysis Engine.
# Alle Schlüssel entstammen dem offiziellen cpp/configs/analysis_example.cfg.
#
# VERBINDLICH: goteach normiert alle Werte auf Schwarz-Perspektive.
# reportAnalysisWinratesAs MUSS daher BLACK sein (Winrate, ScoreLead und
# Ownership werden laut Analysis_Engine.md in dieser Perspektive geliefert).
reportAnalysisWinratesAs = BLACK

logDir = analysis_logs

# Obergrenze pro Stellung; per CLI-Flag -visits pro Query überschreibbar.
# Kosten skalieren ~ Visits × Zuganzahl.
maxVisits = 500

# Parallelität an die eigene Hardware anpassen.
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 16
nnMaxBatchSize = 32
