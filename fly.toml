# Fly.io-Deployment des goteach-Servers MIT echter KataGo-Engine.
#
# Warum Fly und nicht Vercel: der Dienst braucht das KataGo-Binary und das
# neuronale Netz auf der Maschine und rechnet pro Anfrage Minuten auf der
# CPU — beides kann eine Serverless-Funktion nicht. Das Dockerfile dieses
# Repos baut genau dieses Image; diese Datei sagt Fly nur, wie es laufen
# soll.
#
#   fly launch --no-deploy   # einmalig; übernimmt diese Datei
#   fly deploy
#
# Danach zeigt die Vereinsseite mit content::ANALYZE_URL auf
# https://<app>.fly.dev/analyze (plus dieselbe Origin in der CSP).
#
# Betriebsnotizen:
# * KataGo startet pro /analyze-Anfrage als Kindprozess und lädt das Netz
#   neu — auf 4 Kernen kostet schon eine kurze Partie ~2 Minuten. Die
#   Maschinengröße unten (4 Performance-Kerne) ist dafür das sinnvolle
#   Minimum; kleiner wird es zäh, größer wird es besser.
# * Der Fly-Proxy trennt Verbindungen, auf denen länger nichts ankommt.
#   /analyze hält sie deshalb mit Heartbeat-Füllbytes offen (siehe
#   keepAliveInterval in internal/server). Lange Partien dauern trotzdem
#   lange — moderate visits oder Zugbereiche (from/to) bleiben sinnvoll.
# * auto_stop/auto_start: die Maschine schläft ohne Verkehr und kostet
#   dann nichts; die erste Anfrage weckt sie (ein paar Sekunden Kaltstart,
#   zusätzlich zur Analysezeit).
# * CORS: die Vereinsseite ist per Default freigegeben (internal/server);
#   weitere Absender über GOTEACH_CORS_ORIGINS im [env]-Block.

app = "goteach-prod"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Browser-Absender, die /analyze und /login aufrufen dürfen. Keine
  # Geheimnisse — öffentliche Origins, darum hier versioniert statt als
  # Secret: die Vereinsseite unter ihrer Domain und unter Vercel.
  GOTEACH_CORS_ORIGINS = "https://flascheleer-berlin.de,https://www.flascheleer-berlin.de,https://flaleer-berlin.vercel.app"

  # Empfohlen, aber bewusst noch nicht aktiv: Mit GOTEACH_REQUIRE_AUTH = "1"
  # startet der Dienst nicht mehr, wenn AUTH_USERS fehlt — statt still
  # öffentlich zu laufen und pro Anfrage minutenlang alle Kerne zu binden.
  #
  # Vor dem Einschalten prüfen, dass das Secret wirklich gesetzt ist:
  #
  #   fly secrets list          # AUTH_USERS und AUTH_JWT_SECRET müssen da sein
  #
  # Sonst schlägt der nächste Deploy beim Start fehl — genau das ist der
  # Zweck, aber es soll niemanden überraschen.
  # GOTEACH_REQUIRE_AUTH = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # KataGo sättigt alle Kerne; eine zweite Analyse gleichzeitig macht beide
  # langsamer. Eine kleine Warteschlange statt Parallelität.
  [http_service.concurrency]
    type = "requests"
    hard_limit = 2
    soft_limit = 1

  # grace_period großzügig: flyctl wartet beim Deploy auf genau diesen
  # Check, und eine schlafend aktualisierte Maschine braucht einen Moment
  # — ein knapper Wert lässt Deploys rot aussehen, die in Ordnung sind.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "performance-4x"
