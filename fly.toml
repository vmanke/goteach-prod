# fly.toml app configuration file generated for goteach-prod on 2026-08-12T13:00:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "goteach-prod"
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Browser-Absender, die /analyze und /login aufrufen dürfen. Keine
  # Geheimnisse — öffentliche Origins, darum hier versioniert statt als
  # Secret: die Vereinsseite unter ihrer Domain und unter Vercel.
  #
  # Der letzte Eintrag deckt die Vorschau-Deployments ab. Deren Host trägt
  # den Branch-Namen ("…-git-<branch>-…") und steht vorab nicht fest; der
  # Stern springt genau über dieses eine Namensstück, nie über einen Punkt.
  # Darum ist das Team-Suffix Teil des Musters: "*.vercel.app" wäre eine
  # Freigabe für jede fremde Seite auf Vercel.
  GOTEACH_CORS_ORIGINS = "https://flascheleer-berlin.de,https://www.flascheleer-berlin.de,https://flaleer-berlin.vercel.app,https://flaleer-berlin-git-*-vmankes-projects.vercel.app"

  # Empfohlen, aber bewusst noch nicht aktiv: Mit GOTEACH_REQUIRE_AUTH = "1"
  # startet der Dienst nicht mehr, wenn AUTH_USERS fehlt — statt still
  # öffentlich zu laufen und pro Anfrage minutenlang alle Kerne zu binden.
  #
  # Vor dem Einschalten prüfen, dass das Secret wirklich gesetzt ist:
  #
  #   fly secrets list          # AUTH_USERS und AUTH_JWT_SECRET müssen da sein
  #
  # Sonst schlägt der nächste Deploy beim Start fehl — genau das ist der
  # Zweck, aber es soll niemanden überraschen.
  # GOTEACH_REQUIRE_AUTH = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  # Nebenläufigkeit und Check stehen als Abschnitt, nicht als Inline-
  # Tabelle: das Fly-Dashboard schreibt diese Datei bei einer Änderung im
  # UI zurück, und zwar in Abschnittsform. Blieb daneben die Inline-Fassung
  # desselben Schlüssels stehen, war er doppelt belegt und flyctl lud die
  # Datei gar nicht mehr ("key concurrency should be a table, not a
  # value") — jeder Deploy scheiterte dann nach elf Sekunden.

  # KataGo sättigt alle Kerne; eine zweite Analyse gleichzeitig macht beide
  # langsamer. Eine kleine Warteschlange statt Parallelität.
  [http_service.concurrency]
    type = "requests"
    hard_limit = 2
    soft_limit = 1

  # grace_period großzügig: flyctl wartet beim Deploy auf genau diesen
  # Check, und eine schlafend aktualisierte Maschine braucht einen Moment
  # — ein knapper Wert lässt Deploys rot aussehen, die in Ordnung sind.

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = 'performance-4x'

[deploy]
  strategy = 'bluegreen'
