# fly.toml app configuration file generated for goteach-prod on 2026-08-12T13:00:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "goteach-prod"
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Browser-Absender, die /analyze und /login aufrufen dürfen. Keine
  # Geheimnisse — öffentliche Origins, darum hier versioniert statt als
  # Secret: die Vereinsseite unter ihrer Domain und unter Vercel.
  #
  # Der letzte Eintrag deckt die Vorschau-Deployments ab. Vercel vergibt
  # dafür zwei Formen von Host, und beide stehen vorab nicht fest:
  #
  #   flaleer-berlin-git-<branch>-vmankes-projects.vercel.app
  #   flaleer-berlin-<deployment>-vmankes-projects.vercel.app
  #
  # Der Stern deckt beide ab — er springt über genau ein Namensstück, nie
  # über einen Punkt. Projektname und Team-Suffix bleiben fest: gebunden
  # ist die Freigabe damit an dieses Projekt in diesem Team, während
  # "*.vercel.app" jede fremde Seite auf Vercel einschlösse.
  GOTEACH_CORS_ORIGINS = "https://flascheleer-berlin.de,https://www.flascheleer-berlin.de,https://flaleer-berlin.vercel.app,https://flaleer-berlin-*-vmankes-projects.vercel.app"

  # Empfohlen, aber bewusst noch nicht aktiv: Mit GOTEACH_REQUIRE_AUTH = "1"
  # startet der Dienst nicht mehr, wenn AUTH_USERS fehlt — statt still
  # öffentlich zu laufen und pro Anfrage minutenlang alle Kerne zu binden.
  #
  # Vor dem Einschalten prüfen, dass das Secret wirklich gesetzt ist:
  #
  #   fly secrets list          # AUTH_USERS und AUTH_JWT_SECRET müssen da sein
  #
  # Sonst schlägt der nächste Deploy beim Start fehl — genau das ist der
  # Zweck, aber es soll niemanden überraschen.
  #
  # Für die Galerie ist der Schalter NICHT die Absicherung: requireMember
  # (internal/server/auth.go) läuft nie offen, auch ohne AUTH_USERS nicht.
  # Der Schalter deckt weiterhin /analyze ab.
  # GOTEACH_REQUIRE_AUTH = "1"

  # Wo die Fotos der Vereinsgalerie liegen — auf dem Volume unter [[mounts]],
  # nicht im Container. Ist das Volume nicht eingehängt, startet der Dienst
  # gar nicht erst (validatePhotoEnv): Fotos, die still im Container landen,
  # sind beim nächsten Schlafen der Maschine weg.
  GOTEACH_PHOTO_DIR = "/data/photos"

  # Der öffentliche Signierschlüssel der Vereinsseite, gegen den die Galerie
  # die Mitglieder-Tokens prüft. Kein Geheimnis: er prüft Tokens, er stellt
  # keine aus — darum hier versioniert wie die CORS-Origins. Die Quelle ist
  # frontend/src/keys_generated.rs im Repo der Vereinsseite; nach einem
  # FLB_KEYGEN=1 dort muss dieser Wert mitwandern.
  FLB_JWT_PUBLIC_JWK = '{"kty":"EC","crv":"P-256","x":"7JZhsuvgEhe-PKipOJolP_MLvsSUmNhMTC9J3xiVVZw","y":"0zfb0vppJiiCMcRd94FkkjedlCR_usRF4mh_Fv9E4zg"}'

  # Wer fremde Fotos löschen darf. Kommaliste von Namen, wie sie im Token
  # stehen (sub) — bei Vereins-Tokens das, was FLB_SUB beim Ausstellen war.
  GOTEACH_PHOTO_ADMINS = "uwe"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  # Nebenläufigkeit und Check stehen als Abschnitt, nicht als Inline-
  # Tabelle: das Fly-Dashboard schreibt diese Datei bei einer Änderung im
  # UI zurück, und zwar in Abschnittsform. Blieb daneben die Inline-Fassung
  # desselben Schlüssels stehen, war er doppelt belegt und flyctl lud die
  # Datei gar nicht mehr ("key concurrency should be a table, not a
  # value") — jeder Deploy scheiterte dann nach elf Sekunden.

  # KataGo sättigt alle Kerne; eine zweite Analyse gleichzeitig macht beide
  # langsamer. Eine kleine Warteschlange statt Parallelität.
  [http_service.concurrency]
    type = "requests"
    hard_limit = 2
    soft_limit = 1

  # grace_period großzügig: flyctl wartet beim Deploy auf genau diesen
  # Check, und eine schlafend aktualisierte Maschine braucht einen Moment
  # — ein knapper Wert lässt Deploys rot aussehen, die in Ordnung sind.

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

# Der dauerhafte Speicher der Fotogalerie. Anzulegen VOR dem ersten Deploy
# mit dieser Datei, und in derselben Region wie primary_region:
#
#   fly volumes create goteach_photos --region fra --size 3
#
# Ein Volume ist einfach repliziert. Geht die Maschine verloren, sind die
# Fotos weg — das Backup ist Sache des Betreibers (siehe README).
[[mounts]]
  source = "goteach_photos"
  destination = "/data"

[[vm]]
  size = 'performance-4x'

[deploy]
  # Rolling statt bluegreen, seit unter [[mounts]] ein Volume hängt:
  # Blue-Green startet die neuen Maschinen NEBEN den alten, ein Fly-Volume
  # hängt aber immer nur an genau einer. Der Deploy bliebe hängen.
  #
  # Aus demselben Grund bleibt die Maschinenzahl bei 1 (fly scale count 1):
  # eine zweite Maschine hätte kein Volume, und ein dort hochgeladenes Foto
  # wäre auf der anderen ein 404.
  strategy = 'rolling'
