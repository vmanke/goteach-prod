# goteach mit echter KataGo-Engine: docker compose up --build
services:
  goteach:
    build:
      context: .
      # Für CPUs ohne AVX2 einkommentieren:
      # args:
      #   KATAGO_FLAVOR: eigen
      # Bilderkennung (Stufen 1-2) mit ins Image nehmen:
      # args:
      #   WITH_VISION: "1"
    # environment:
    #   GOTEACH_VISION_CMD: "python3 -m goteach_vision detect -"
    #   # JWT-Login (optional; Hashes: echo -n 'pw' | go run ./cmd/passhash):
    #   AUTH_USERS: "alice:pbkdf2-sha256$$600000$$…$$…"   # $$ = $ in Compose
    #   AUTH_JWT_SECRET: "langes-zufaelliges-secret"
    #   # Engine-Passthrough für eine Instanz ohne eigene Engine:
    #   KATAGO_ENGINE_TOKEN: "gemeinsames-secret"
    ports:
      - "8080:8080"
    restart: unless-stopped
